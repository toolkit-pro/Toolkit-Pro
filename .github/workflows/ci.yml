name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # ===================
  # Code Quality Check
  # ===================
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pgsql, redis, mbstring, xml, zip
          coverage: none
          tools: composer:v2
      
      - name: Cache Composer Dependencies
        uses: actions/cache@v3
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-
      
      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      
      - name: Run Laravel Pint (Code Style)
        run: vendor/bin/pint --test
      
      - name: Run PHPStan (Static Analysis)
        run: |
          composer require --dev phpstan/phpstan
          vendor/bin/phpstan analyse app --level=5 --no-progress
      
      - name: Check Syntax Errors
        run: |
          find app -name "*.php" -exec php -l {} \; | grep -v "No syntax errors"

  # ===================
  # Frontend Build
  # ===================
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Cache NPM Dependencies
        uses: actions/cache@v3
        with:
          path: node_modules
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-
      
      - name: Install Dependencies
        run: npm ci --no-audit --no-fund
      
      - name: Run ESLint
        run: npm run lint:check
      
      - name: Run Prettier Check
        run: npm run format:check
      
      - name: Build Assets
        run: npm run build
        env:
          NODE_ENV: production
      
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: frontend-build
          path: public/build
          retention-days: 7

  # ===================
  # Unit Tests
  # ===================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: toolkit_test
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pgsql, redis, mbstring, xml, zip
          coverage: xdebug
          tools: composer:v2
      
      - name: Cache Composer Dependencies
        uses: actions/cache@v3
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-
      
      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      
      - name: Copy Environment File
        run: cp .env.example .env
      
      - name: Generate Application Key
        run: php artisan key:generate
      
      - name: Run Migrations
        run: php artisan migrate --force
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: toolkit_test
          DB_USERNAME: admin
          DB_PASSWORD: secret
      
      - name: Run Unit Tests
        run: php artisan test tests/Unit --coverage --coverage-text
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: toolkit_test
          DB_USERNAME: admin
          DB_PASSWORD: secret
      
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: unit-test-results
          path: tests/coverage
          retention-days: 7

  # ===================
  # Feature Tests
  # ===================
  feature-tests:
    name: Feature Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: toolkit_test
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      elasticsearch:
        image: elasticsearch:8.10.0
        env:
          discovery.type: single-node
          xpack.security.enabled: false
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -f http://localhost:9200"
          --health-interval 30s
          --health-timeout 10s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pgsql, redis, mbstring, xml, zip
          coverage: none
          tools: composer:v2
      
      - name: Cache Composer Dependencies
        uses: actions/cache@v3
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-
      
      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      
      - name: Copy Environment File
        run: cp .env.example .env
      
      - name: Generate Application Key
        run: php artisan key:generate
      
      - name: Run Migrations
        run: php artisan migrate --force --seed
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: toolkit_test
          DB_USERNAME: admin
          DB_PASSWORD: secret
      
      - name: Run Feature Tests
        run: php artisan test tests/Feature
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: toolkit_test
          DB_USERNAME: admin
          DB_PASSWORD: secret
      
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: feature-test-results
          path: tests/logs
          retention-days: 7

  # ===================
  # Security Check
  # ===================
  security-check:
    name: Security Check
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
      
      - name: Install Security Checker
        run: composer require --dev sensiolabs/security-checker
      
      - name: Run Security Check
        run: vendor/bin/security-checker security:check composer.lock
      
      - name: Check for Secrets
        run: |
          if grep -r "password\|secret\|api_key\|token" .env .env.example 2>/dev/null | grep -v "example\|null\|your_"; then
            echo "⚠️ Warning: Potential secrets found in environment files"
            exit 1
          fi
      
      - name: Run npm Audit
        run: npm audit --audit-level=high

  # ===================
  # Docker Build
  # ===================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [code-quality, frontend, unit-tests, feature-tests]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: toolkit-pro:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Run Docker Compose
        run: |
          docker-compose up -d
          sleep 30
          docker-compose ps
          docker-compose logs app
      
      - name: Test Application
        run: |
          curl -f http://localhost:8080/api/v1/tools || exit 1
      
      - name: Cleanup
        run: docker-compose down -v
