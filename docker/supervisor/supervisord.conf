; ===================
; Toolkit Pro Supervisor Configuration
; ===================

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
user=root

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; ===================
; PHP-FPM
; ===================
[program:php-fpm]
command=php-fpm
autostart=true
autorestart=true
startsecs=0
startretries=3
stopwaitsecs=10
priority=1
stdout_logfile=/var/log/supervisor/php-fpm.out.log
stderr_logfile=/var/log/supervisor/php-fpm.err.log
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB

; ===================
; Nginx
; ===================
[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
startsecs=0
startretries=3
stopwaitsecs=10
priority=2
stdout_logfile=/var/log/supervisor/nginx.out.log
stderr_logfile=/var/log/supervisor/nginx.err.log
stdout_logfile_maxbytes=50MB
stderr_logfile_maxbytes=50MB

; ===================
; Queue Workers
; ===================

; High Priority Queue
[program:queue-worker-high]
command=php /var/www/html/artisan queue:work redis --queue=high --sleep=1 --tries=3 --timeout=120
process_name=%(program_name)s_%(process_num)02d
numprocs=2
autostart=true
autorestart=true
startsecs=5
startretries=5
stopwaitsecs=30
priority=10
redirect_stderr=true
stdout_logfile=/var/log/supervisor/queue-worker-high.log
stdout_logfile_maxbytes=50MB

; Default Queue
[program:queue-worker-default]
command=php /var/www/html/artisan queue:work redis --queue=default --sleep=3 --tries=3 --timeout=90
process_name=%(program_name)s_%(process_num)02d
numprocs=4
autostart=true
autorestart=true
startsecs=5
startretries=5
stopwaitsecs=30
priority=10
redirect_stderr=true
stdout_logfile=/var/log/supervisor/queue-worker-default.log
stdout_logfile_maxbytes=50MB

; Low Priority Queue
[program:queue-worker-low]
command=php /var/www/html/artisan queue:work redis --queue=low --sleep=5 --tries=2 --timeout=60
process_name=%(program_name)s_%(process_num)02d
numprocs=2
autostart=true
autorestart=true
startsecs=5
startretries=5
stopwaitsecs=30
priority=10
redirect_stderr=true
stdout_logfile=/var/log/supervisor/queue-worker-low.log
stdout_logfile_maxbytes=50MB

; ===================
; Scheduler
; ===================
[program:scheduler]
command=php /var/www/html/artisan schedule:work
autostart=true
autorestart=true
startsecs=5
startretries=5
stopwaitsecs=30
priority=20
redirect_stderr=true
stdout_logfile=/var/log/supervisor/scheduler.log
stdout_logfile_maxbytes=50MB

; ===================
; WebSocket Server
; ===================
[program:websocket]
command=php /var/www/html/artisan websockets:serve --host=0.0.0.0 --port=6001
autostart=true
autorestart=true
startsecs=5
startretries=5
stopwaitsecs=30
priority=20
redirect_stderr=true
stdout_logfile=/var/log/supervisor/websocket.log
stdout_logfile_maxbytes=50MB

; ===================
; Laravel Horizon
; ===================
[program:horizon]
command=php /var/www/html/artisan horizon
autostart=true
autorestart=true
startsecs=5
startretries=5
stopwaitsecs=60
priority=20
redirect_stderr=true
stdout_logfile=/var/log/supervisor/horizon.log
stdout_logfile_maxbytes=50MB

; ===================
; Event Listener
; ===================
[program:event-listener]
command=php /var/www/html/artisan events:listen
autostart=true
autorestart=true
startsecs=5
startretries=5
stopwaitsecs=30
priority=30
redirect_stderr=true
stdout_logfile=/var/log/supervisor/event-listener.log
stdout_logfile_maxbytes=50MB

; ===================
; Cache Warmer
; ===================
[program:cache-warmer]
command=php /var/www/html/artisan cache:warmup
autostart=false
autorestart=true
startsecs=5
startretries=3
stopwaitsecs=30
priority=40
redirect_stderr=true
stdout_logfile=/var/log/supervisor/cache-warmer.log
stdout_logfile_maxbytes=50MB

; ===================
; System Monitor
; ===================
[program:system-monitor]
command=php /var/www/html/artisan system:monitor
autostart=true
autorestart=true
startsecs=30
startretries=5
stopwaitsecs=30
priority=40
redirect_stderr=true
stdout_logfile=/var/log/supervisor/system-monitor.log
stdout_logfile_maxbytes=50MB

; ===================
; Event Groups
; ===================
[group:queue-workers]
programs=queue-worker-high,queue-worker-default,queue-worker-low
priority=10

[group:services]
programs=php-fpm,nginx
priority=1

[group:background]
programs=scheduler,websocket,horizon,event-listener
priority=20

; ===================
; Event Listeners
; ===================
[eventlistener:processes]
command=supervisorctl status
events=PROCESS_STATE
buffer_size=100
stdout_logfile=/var/log/supervisor/process-events.log
stderr_logfile=/var/log/supervisor/process-events.err.log
